name: Decode Engineering Video Renderer

on:
  workflow_dispatch:
    inputs:
      scenes_data:
        description: 'JSON array of scenes data'
        required: true
        type: string
      title:
        description: 'Video Title'
        required: true
        type: string
      description:
        description: 'Video Description'
        required: true
        type: string
      thumbnail_prompt:
        description: 'Prompt for Thumbnail Generation'
        required: true
        type: string

# GitHub Releases create करने के लिए यह permission अनिवार्य है
permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp edge-tts

      - name: 🚀 Run Async Video Render Pipeline
        env:
          SCENES_DATA: ${{ inputs.scenes_data }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          THUMBNAIL_PROMPT: ${{ inputs.thumbnail_prompt }}
          # Secrets (GitHub Repository Secrets में सेट होने चाहिए)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # gh cli को authenticate करने के लिए GitHub Token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          python render_video.py
