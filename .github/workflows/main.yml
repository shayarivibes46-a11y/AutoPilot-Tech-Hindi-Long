name: Decode Engineering Video Renderer

on:
  workflow_dispatch:
    inputs:
      scenes_data:
        description: 'JSON array of scenes data'
        required: true
        type: string
      title:
        description: 'Video Title'
        required: true
        type: string
      description:
        description: 'Video Description'
        required: true
        type: string
      thumbnail_prompt:
        description: 'Prompt for Thumbnail Generation'
        required: true
        type: string
  # 👇 YEH LINE MISSING THI! Iske bina n8n se trigger nahi hoga
  repository_dispatch:
    types: [render_and_upload]

# GitHub Releases create karne ke liye permission
permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp edge-tts

      - name: 🚀 Run Async Video Render Pipeline
        env:
          # 👇 Yahan dono ka support lagaya hai (client_payload for n8n, inputs for manual)
          SCENES_DATA: ${{ github.event.client_payload.scenes_data || inputs.scenes_data }}
          TITLE: ${{ github.event.client_payload.title || inputs.title }}
          DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt || inputs.thumbnail_prompt }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.CHAT_ID }}
          
          # Secrets
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          python render_video.py
