name: Render Video Pipeline

on:
  repository_dispatch:
    types: [render_and_upload]
  workflow_dispatch:
    inputs:
      title:
        description: 'Video Title'
        required: false
        default: 'Engineering Video'
      description:
        description: 'Video Description'
        required: false
        default: 'Educational video'
      thumbnail_prompt:
        description: 'Thumbnail Prompt'
        required: false
        default: 'Cinematic engineering thumbnail'

# GITHUB_TOKEN को फाइल्स और एक्शन्स डिलीट करने की परमिशन देना जरूरी है
permissions:
  actions: write
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts aiohttp

      - name: 🚀 Run Async Video Render Pipeline
        env:
          # Secrets
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || github.event.client_payload.chat_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Optional Metadata Variables
          TITLE: ${{ github.event.client_payload.title || inputs.title }}
          DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt || inputs.thumbnail_prompt }}
        run: |
          python render_video.py

      - name: 🧹 Auto-Delete Old Releases & Videos (Keep Only Latest 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. यह कोड पुरानी GitHub Releases और उनके Tags को डिलीट करेगा, सिर्फ सबसे नई (1) छोड़कर
          releases=$(gh release list --limit 100 | awk '{print $1}')
          count=$(echo "$releases" | wc -w)
          
          if [ "$count" -gt 1 ]; then
            echo "Found $count releases. Keeping the latest 1 and deleting the rest..."
            old_releases=$(echo "$releases" | tail -n +2)
            for release in $old_releases; do
              echo "Deleting release and tag: $release"
              gh release delete "$release" --cleanup-tag -y || true
            done
          else
            echo "1 or fewer releases found. No release cleanup needed."
          fi

          # 2. यह कोड रिपॉजिटरी में मौजूद पुरानी वीडियो को डिलीट करेगा, सिर्फ 1 छोड़कर
          shopt -s nullglob
          videos=( $(ls -t *.mp4 2>/dev/null) )
          
          if [ ${#videos[@]} -gt 1 ]; then
            echo "Found ${#videos[@]} videos. Keeping latest 1 and deleting the rest..."
            for file in "${videos[@]:1}"; do
              rm -f "$file"
            done
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Auto-cleanup: Deleted old videos, keeping latest 1" || true
            git push || true
          else
            echo "1 or fewer videos found in repository. No cleanup needed."
          fi
        continue-on-error: true
